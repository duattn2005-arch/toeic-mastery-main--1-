name: Deploy to iNET cloud server

# Runs on every push to main: SSHes into the VPS, pulls the new code, installs
# deps, applies any pending Prisma migrations, rebuilds, and restarts the app
# — so a push to GitHub is all it takes to update toeicmastery.click.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script_stop: true
          script: |
            set -e

            # Locate the app directory. Prefer asking pm2 for the already-running
            # app's cwd — this server turned out to have stale package.json
            # copies from an unrelated repo checkout elsewhere on disk (under
            # /root), so a blind filesystem-wide grep can pick the wrong one.
            # Fall back to searching /var/www (where this app actually lives)
            # and only then the whole filesystem, for a fresh server with
            # nothing running yet.
            APP_DIR=$(pm2 jlist 2>/dev/null | grep -o '"pm_cwd":"[^"]*"' | head -1 | sed -E 's/"pm_cwd":"(.*)"/\1/')
            if [ -z "$APP_DIR" ]; then
              APP_DIR=$(grep -rl '"name": "toeic-mastery"' --include=package.json /var/www --exclude-dir=node_modules 2>/dev/null | head -1 | xargs -r dirname)
            fi
            if [ -z "$APP_DIR" ]; then
              APP_DIR=$(grep -rl '"name": "toeic-mastery"' --include=package.json / --exclude-dir=node_modules 2>/dev/null | head -1 | xargs -r dirname)
            fi
            if [ -z "$APP_DIR" ]; then
              echo "::error::Could not locate the toeic-mastery app directory on this server."
              exit 1
            fi
            echo "App directory: $APP_DIR"
            cd "$APP_DIR"

            git pull origin main

            # Sync INTERNAL_TRACK_SECRET (referral-click tracking's
            # proxy<->route-handler shared secret, see src/lib/auth/proxy-
            # session.ts) into the server's own .env — only appends when the
            # GitHub secret is set AND .env doesn't already have this key, so
            # this never overwrites a value set by hand and no-ops harmlessly
            # on repos that haven't added the secret yet.
            if [ -n "${{ secrets.INTERNAL_TRACK_SECRET }}" ] && ! grep -q '^INTERNAL_TRACK_SECRET=' .env 2>/dev/null; then
              echo 'INTERNAL_TRACK_SECRET=${{ secrets.INTERNAL_TRACK_SECRET }}' >> .env
            fi

            if [ -f pnpm-lock.yaml ]; then
              corepack enable && pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then
              yarn install --frozen-lockfile
            else
              npm ci
            fi

            npx prisma generate
            npx prisma migrate deploy

            # This app deploys many times a day, and Turbopack's production
            # build reuses .next's cached artifacts across runs — after enough
            # consecutive deploys that drifted into a production ChunkLoadError
            # ("Cannot find module .../ssr/<hash>._.js") on pages the latest
            # commit never even touched, because their compiled output still
            # pointed at a chunk hash an earlier build had since overwritten.
            # Building from a clean slate every time costs a bit more time but
            # can't accumulate that kind of stale cross-build reference.
            rm -rf .next
            npm run build

            # Restart however this app is actually being run — tries PM2,
            # then a systemd service, then falls back to telling the operator
            # to do it by hand rather than guessing further.
            if command -v pm2 >/dev/null 2>&1 && pm2 list | grep -qi toeic; then
              pm2 restart all
            elif systemctl list-units --type=service 2>/dev/null | grep -qi toeic; then
              sudo systemctl restart "$(systemctl list-units --type=service | grep -i toeic | awk '{print $1}' | head -1)"
            else
              echo "::warning::Built successfully but couldn't detect a PM2 or systemd process to restart automatically. Restart the app manually."
            fi
